<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>XCVR Scan</title>
<meta name="description" content="Optical transceiver barcode scanner and inventory log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XCVR Scan">
<meta name="theme-color" content="#10161f">
<style>
:root{
  --bg:#10161f;          /* deep slate */
  --panel:#171f2b;
  --panel-2:#1d2735;
  --line:#2b3648;
  --ink:#e8edf4;
  --ink-dim:#8fa3bf;
  --accent:#f5c518;      /* SMF-jacket yellow */
  --accent-ink:#10161f;
  --good:#3ddc84;
  --bad:#ff5d5d;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}

header{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em}
header h1 b{color:var(--accent);font-weight:700}
header .count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim)}

/* ---- scanner viewport ---- */
.viewport{
  position:relative;margin:0 16px;border-radius:14px;overflow:hidden;
  background:#000;aspect-ratio:4/3;border:1px solid var(--line);
}
video{width:100%;height:100%;object-fit:cover;display:block}
.viewport.idle video{display:none}
.idle-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-dim);font-size:14px;text-align:center;padding:0 24px;
}
.reticle{position:absolute;inset:0;pointer-events:none;display:none}
.viewport.live .reticle{display:block}
.reticle::before{
  content:"";position:absolute;left:10%;right:10%;top:32%;bottom:32%;
  border-radius:10px;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/26px 3px,
    linear-gradient(var(--accent),var(--accent)) top left/3px 26px,
    linear-gradient(var(--accent),var(--accent)) top right/26px 3px,
    linear-gradient(var(--accent),var(--accent)) top right/3px 26px,
    linear-gradient(var(--accent),var(--accent)) bottom left/26px 3px,
    linear-gradient(var(--accent),var(--accent)) bottom left/3px 26px,
    linear-gradient(var(--accent),var(--accent)) bottom right/26px 3px,
    linear-gradient(var(--accent),var(--accent)) bottom right/3px 26px;
  background-repeat:no-repeat;
}
.flash{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .35s}
.flash.on{opacity:.45;transition:none}
.last-read{
  position:absolute;left:0;right:0;bottom:0;padding:8px 12px;
  background:rgba(16,22,31,.85);backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:13px;color:var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;
}
.last-read.show{display:block}

/* ---- controls ---- */
.controls{display:flex;gap:10px;padding:12px 16px}
button{
  font-family:var(--sans);font-size:15px;font-weight:600;border:none;border-radius:10px;
  padding:12px 14px;cursor:pointer;color:var(--ink);background:var(--panel-2);
}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#btnStart{flex:1;background:var(--accent);color:var(--accent-ink)}
#btnStart.stop{background:var(--bad);color:#fff}
#btnTorch[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hidden{display:none !important}

/* ---- log ---- */
.log{flex:1;padding:4px 16px 16px}
.log-head{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
.log-head h2{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase}
.log-head .spacer{flex:1}
.log-head button{font-size:12px;padding:7px 10px;border-radius:8px;color:var(--ink-dim)}
.entry{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;
}
.entry .codes{flex:1;min-width:0}
.entry .val{font-family:var(--mono);font-size:14px;word-break:break-all;color:var(--ink)}
.entry .meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.entry .fmt{color:var(--accent)}
.entry .del{background:none;color:var(--ink-dim);font-size:16px;padding:2px 6px;line-height:1}
.entry input.note{
  margin-top:6px;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);font-family:var(--sans);font-size:13px;padding:6px 8px;
}
.empty{color:var(--ink-dim);font-size:14px;text-align:center;padding:28px 0}
.toast{
  position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.err{color:var(--bad);font-size:13px;padding:8px 16px;display:none;white-space:pre-wrap}
.err.show{display:block}
@media (prefers-reduced-motion: reduce){
  .flash{transition:none}.toast{transition:none}button:active{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><b>XCVR</b> SCAN</h1>
    <span class="count" id="count">0 scans</span>
  </header>

  <div class="viewport idle" id="viewport">
    <video id="video" playsinline muted></video>
    <div class="idle-msg" id="idleMsg">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8fa3bf" stroke-width="1.6" aria-hidden="true">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M7 8v8M10 8v8M13 8v5M16 8v8" stroke="#f5c518"/>
      </svg>
      <span>Point at a module label barcode —<br>Code 128, QR, Data Matrix supported.</span>
    </div>
    <div class="reticle"></div>
    <div class="flash" id="flash"></div>
    <div class="last-read" id="lastRead"></div>
  </div>

  <div class="err" id="err"></div>

  <div class="controls">
    <button id="btnStart">Start camera</button>
    <button id="btnTorch" class="hidden" aria-pressed="false">Torch</button>
  </div>

  <section class="log">
    <div class="log-head">
      <h2>Scan log</h2>
      <div class="spacer"></div>
      <button id="btnExport">Export CSV</button>
      <button id="btnCopy">Copy</button>
      <button id="btnClear">Clear</button>
    </div>
    <div id="entries"></div>
    <div class="empty" id="empty">No scans yet.</div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const KEY = "xcvr-scans-v1";
let memStore = [];
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return memStore; } },
  save(list){ try { localStorage.setItem(KEY, JSON.stringify(list)); } catch { memStore = list; } }
};
let scans = store.load();

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const video=$("video"), viewport=$("viewport"), flash=$("flash"), lastRead=$("lastRead"),
      btnStart=$("btnStart"), btnTorch=$("btnTorch"), entriesEl=$("entries"),
      emptyEl=$("empty"), countEl=$("count"), toastEl=$("toast"), errEl=$("err");

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1800);
}
function showErr(msg){ errEl.textContent = msg; errEl.classList.add("show"); }
function clearErr(){ errEl.classList.remove("show"); }

function beep(){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="square"; o.frequency.value = 1568; g.gain.value = 0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.09);
  }catch(e){}
}

/* Light parsing for PN/SN style payloads often found in module QR / Data Matrix */
function parseFields(text){
  const out = {};
  const pn = text.match(/\bP\/?N[:\s=]+([A-Za-z0-9._\-]+)/i);
  const sn = text.match(/\bS\/?N[:\s=]+([A-Za-z0-9._\-]+)/i);
  if (pn) out.pn = pn[1];
  if (sn) out.sn = sn[1];
  return out;
}

/* ---------- render log ---------- */
function render(){
  countEl.textContent = scans.length + (scans.length===1 ? " scan" : " scans");
  emptyEl.style.display = scans.length ? "none" : "block";
  entriesEl.innerHTML = "";
  // newest first
  scans.slice().reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "entry";
    const codes = document.createElement("div"); codes.className="codes";
    const val = document.createElement("div"); val.className="val"; val.textContent = s.text;
    const meta = document.createElement("div"); meta.className="meta";
    const fmt = document.createElement("span"); fmt.className="fmt"; fmt.textContent = s.format;
    const ts = document.createElement("span"); ts.textContent = new Date(s.ts).toLocaleString();
    meta.appendChild(fmt); meta.appendChild(ts);
    if (s.pn){ const e=document.createElement("span"); e.textContent="PN "+s.pn; meta.appendChild(e); }
    if (s.sn){ const e=document.createElement("span"); e.textContent="SN "+s.sn; meta.appendChild(e); }
    const note = document.createElement("input");
    note.className="note"; note.placeholder="Note (location, testbed, port…)"; note.value = s.note||"";
    note.addEventListener("change", () => { s.note = note.value; store.save(scans); });
    codes.appendChild(val); codes.appendChild(meta); codes.appendChild(note);
    const del = document.createElement("button"); del.className="del"; del.textContent="✕";
    del.setAttribute("aria-label","Delete entry");
    del.addEventListener("click", () => {
      scans = scans.filter(x => x.id !== s.id); store.save(scans); render();
    });
    div.appendChild(codes); div.appendChild(del);
    entriesEl.appendChild(div);
  });
}

/* ---------- record a scan ---------- */
let lastText = "", lastAt = 0;
function record(text, format){
  const now = Date.now();
  if (text === lastText && (now - lastAt) < 4000) return;  // debounce repeats
  lastText = text; lastAt = now;
  const fields = parseFields(text);
  scans.push({ id: now + "-" + Math.random().toString(36).slice(2,7),
               text, format, ts: now, note: "", ...fields });
  store.save(scans);
  render();
  beep();
  if (navigator.vibrate) navigator.vibrate(60);
  flash.classList.add("on"); setTimeout(()=>flash.classList.remove("on"), 60);
  lastRead.textContent = text; lastRead.classList.add("show");
}

/* ---------- scanner ---------- */
let reader = null, running = false, track = null;

function makeReader(){
  const hints = new Map();
  const F = ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    F.CODE_128, F.CODE_39, F.QR_CODE, F.DATA_MATRIX, F.EAN_13, F.ITF, F.CODABAR
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return new ZXing.BrowserMultiFormatReader(hints, 200 /* ms between decode attempts */);
}

async function start(){
  clearErr();
  if (typeof ZXing === "undefined"){
    showErr("Scanner library failed to load. Connect to the internet once so it can be cached for offline use.");
    return;
  }
  try{
    reader = reader || makeReader();
    running = true;
    btnStart.textContent = "Stop"; btnStart.classList.add("stop");
    viewport.classList.remove("idle"); viewport.classList.add("live");

    const constraints = {
      audio:false,
      video:{ facingMode:{ ideal:"environment" },
              width:{ ideal:1920 }, height:{ ideal:1080 } }
    };
    await reader.decodeFromConstraints(constraints, video, (result, err) => {
      if (result) record(result.getText(), result.getBarcodeFormat ? ZXing.BarcodeFormat[result.getBarcodeFormat()] : "UNKNOWN");
      // err fires constantly when nothing is in frame — ignore NotFoundException
    });

    // torch support detection
    const stream = video.srcObject;
    track = stream && stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    if (caps && caps.torch) btnTorch.classList.remove("hidden");
  }catch(e){
    running = false;
    btnStart.textContent = "Start camera"; btnStart.classList.remove("stop");
    viewport.classList.add("idle"); viewport.classList.remove("live");
    if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")){
      showErr("Camera access denied. iOS requires HTTPS and camera permission (Settings → Safari → Camera, or the aA menu → Website Settings).");
    } else if (e && e.name === "NotFoundError"){
      showErr("No camera found.");
    } else {
      showErr("Could not start camera: " + (e && e.message ? e.message : e));
    }
  }
}

function stop(){
  running = false;
  if (reader) reader.reset();
  track = null;
  btnStart.textContent = "Start camera"; btnStart.classList.remove("stop");
  btnTorch.classList.add("hidden"); btnTorch.setAttribute("aria-pressed","false");
  viewport.classList.add("idle"); viewport.classList.remove("live");
  lastRead.classList.remove("show");
}

btnStart.addEventListener("click", () => running ? stop() : start());

btnTorch.addEventListener("click", async () => {
  if (!track) return;
  const on = btnTorch.getAttribute("aria-pressed") !== "true";
  try{
    await track.applyConstraints({ advanced:[{ torch:on }] });
    btnTorch.setAttribute("aria-pressed", String(on));
  }catch(e){ toast("Torch not available"); }
});

/* ---------- export ---------- */
function csv(){
  const esc = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const rows = [["timestamp","format","raw","pn","sn","note"]];
  scans.forEach(s => rows.push([new Date(s.ts).toISOString(), s.format, s.text, s.pn||"", s.sn||"", s.note||""]));
  return rows.map(r => r.map(esc).join(",")).join("\r\n");
}

$("btnExport").addEventListener("click", async () => {
  if (!scans.length) return toast("Nothing to export");
  const name = "xcvr_scans_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".csv";
  const blob = new Blob([csv()], { type:"text/csv" });
  const file = new File([blob], name, { type:"text/csv" });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:name }); return; } catch(e){ /* user cancelled */ }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
});

$("btnCopy").addEventListener("click", async () => {
  if (!scans.length) return toast("Nothing to copy");
  try { await navigator.clipboard.writeText(csv()); toast("CSV copied"); }
  catch(e){ toast("Copy failed"); }
});

$("btnClear").addEventListener("click", () => {
  if (!scans.length) return;
  if (confirm("Delete all " + scans.length + " scans?")){
    scans = []; store.save(scans); render(); toast("Log cleared");
  }
});

/* ---------- service worker ---------- */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

render();
})();
</script>
</body>
</html>
